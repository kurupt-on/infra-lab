[defaults]
inventory = inventories/production/hosts.yml

roles_path = roles

host_key_checking = false

remote_user = ansible

private_key_file = __pkf__

forks = 10

deprecation_warnings = false

#vault_password_file = .vault_key

[privilege_escalation]
become = true
become_method = sudo
become_user = root
become_ask_pass = false
